services:

  backend:
    build:
      context: ./backend

    container_name: techpath-backend

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    restart: unless-stopped
  
  frontend:
    build:
      context: ./frontend

    container_name: techpath-frontend

    ports:
      - "5173:80"

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped